{% load static %}
<link rel="icon" href="{% static 'img/favicon.png' %}">
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Вход на сайт | ИТОС</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/index.css' %}" rel="stylesheet">

</head>

<body>
    <div class="login-card">
        <div class="text-card">
        <div class="card">

            <h6>Образовательная статистика</h6>
            <h6>по ИТ-дисциплинам МУИВ - ИТОС</h6>
            </div>

        <!--  Форма аутентификации  -->
        <form method="post" action="{% url 'accounts:login' %}">
            {% csrf_token %}

            <div class="inputs">

            <!--  Логин  -->
            <div class="mb-3 text-start">
                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Логин"
                       required autofocus>
            </div>

            <!--  Пароль  -->
            <div class="mb-3 text-start">
                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Пароль"
                       required>
            </div>

            <!--  Вход  -->
            <button type="submit" class="btn btn-brand w-100 mt-2">
                Вход
            </button>

            {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>

            {% endif %}
                </div>
        </form>

        </div>
    </div>
</body>
</html>
